name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mkdir -p cmdline-tools
          mv cmdline-tools cmdline-tools-old 2>/dev/null || true
          if [ -d latest ]; then
            rm -rf cmdline-tools
            mv latest cmdline-tools
          fi
          if [ ! -d cmdline-tools ]; then
            mkdir -p cmdline-tools
            mv cmdline-tools-old/* cmdline-tools/ 2>/dev/null || true
          fi
          echo "y" | $HOME/android-sdk/cmdline-tools/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        shell: bash

      - name: Set Android env
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/cmdline-tools/bin" >> $GITHUB_PATH

      - name: Build release APK
        working-directory: Pulse
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-APK
          path: Pulse/app/build/outputs/apk/release/*.apk
