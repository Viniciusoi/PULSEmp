name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools" ] && [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            echo "SDK already structured correctly"
          else
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            if [ -d "$ANDROID_SDK_ROOT/cmdline-tools" ] && [ "$(ls -A "$ANDROID_SDK_ROOT/cmdline-tools")" = "" ]; then
              echo "cmdline-tools folder is empty"
            fi

            if [ -d "$ANDROID_SDK_ROOT/cmdline-tools" ]; then
              rm -rf "$ANDROID_SDK_ROOT/cmdline-tools"
            fi

            if [ -d "$ANDROID_SDK_ROOT/latest" ]; then
              mv "$ANDROID_SDK_ROOT/latest" "$ANDROID_SDK_ROOT/cmdline-tools"
            else
              mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            fi
          fi

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build release APK
        working-directory: Pulse
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-APK
          path: Pulse/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
