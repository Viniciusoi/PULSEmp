name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$ANDROID_SDK_ROOT"

          cd /tmp
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          rm -rf /tmp/android-cli
          mkdir -p /tmp/android-cli
          unzip -q cmdline-tools.zip -d /tmp/android-cli

          if [ -d /tmp/android-cli/cmdline-tools ]; then
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            mv /tmp/android-cli/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          else
            echo "Unexpected extracted layout"
            find /tmp/android-cli -maxdepth 3 -type d
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        working-directory: Pulse
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-APK
          path: Pulse/app/build/outputs/apk/release/*.apk
          if-no-files-found: error